name: Script checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in *.sh tests/*.sh; do bash -n "$f"; done
      - run: shellcheck *.sh tests/*.sh
      - run: bash tests/test.sh
      - run: bash tests/test-bt.sh
